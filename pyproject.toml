[project]
name = "namegen"
version = "0.1.0"
description = "Procedural name candidates for worldbuilding, curated by an LLM instead of invented by it"
readme = "README.md"
authors = [
    { name = "Barta Gábor", email = "emoryy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cmudict>=1.1.3",
    "g2p-en>=2.1.0",
    "nltk>=3.10.3",
    "unidecode>=1.4.0",
    "wordfreq>=3.1.1",
]

[project.scripts]
namegen = "namegen:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
